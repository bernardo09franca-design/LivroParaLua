<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#17131d">
  <title>Para Luane</title>
  <link rel="stylesheet" href="css/style.css?v=6">
  <link rel="stylesheet" href="css/animations.css?v=6">
</head>
<body>
<main class="experience">
  <div class="background-overlay"></div>
  <header class="intro">
    <p class="eyebrow">UM PRESENTE PARA</p>
    <h1>Luane</h1>
    <p id="interactionHint">Arraste para conhecer seu presente</p>
  </header>
  <section class="stage" aria-label="Presente interativo">
    <div class="book-scene" id="bookScene">
      <div class="book-rotator" id="bookRotator">
        <div class="book">
          <div class="book-back"></div>
          <div class="book-pages"></div>
          <div class="book-spine"></div>
          <div class="book-front">
            <img src="assets/book/estilhaca-me.jpg" alt="Capa de Estilhaça-Me" class="cover-image" draggable="false">
          </div>
          <div class="gift-cover" id="giftCover">
            <img src="assets/file_0000000006dc8210b25cf86498dc99bc.png?v=6" alt="Presente embrulhado" class="gift-image" draggable="false">
          </div>
        </div>
      </div>
      <div class="shadow"></div>
    </div>
  </section>
  <section class="controls">
    <button id="unwrapButton" class="unwrap-button" type="button"><span>✦</span> Desembrulhar</button>
    <p id="controlsInstruction">Toque e arraste o presente para girar</p>
  </section>
  <section class="reveal-message" id="revealMessage" aria-hidden="true">
    <p>Espero que você goste.</p>
    <strong>Esse é para você, Luane. ♡</strong>
  </section>
</main>
<script src="js/book.js?v=6"></script>
<script src="js/unwrap.js?v=6"></script>
</body>
</html>
